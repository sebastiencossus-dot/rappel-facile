<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
  <title>Rappel Facile — RDV</title>
</head>
<body>

<button class="AdminBurger" onclick="toggleAdminMenu()">
  <i class="fa-solid fa-bars" id="burgerIcon"></i>
</button>
<div class="AdminOverlay" id="adminOverlay" onclick="closeAdminMenu()"></div>

<div class="AdminLayout">

  <aside class="AdminSidebar" id="adminSidebar"
         th:replace="~{admin-sidebar :: sidebar('rdv')}"></aside>

  <main class="AdminContent">

    <div class="AdminTopbar">
      <h1>Rendez-vous</h1>
      <div class="AdminTopbar-user">
        Connecté en tant que
        <strong th:text="${currentUser != null ? currentUser.email : 'admin'}"></strong>
      </div>
    </div>

    <!-- Messages flash -->
    <div th:if="${success}"
         style="background-color:#d4edda; color:#155724; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
      <i class="fa-solid fa-check"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         style="background-color:#f8d7da; color:#721c24; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
      <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
    </div>

    <!-- Filtres par statut -->
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
      <a th:href="@{/admin/rdv}"
         style="border-radius:10px; padding:8px 16px; text-decoration:none; font-size:13px; font-weight:bold;"
         th:style="${statutFiltre == null} ? 'background-color:#000; color:#fff;' : 'background-color:#eee; color:#000;'">
        Tous
      </a>
      <a th:href="@{/admin/rdv(statut=1)}"
         style="border-radius:10px; padding:8px 16px; text-decoration:none; font-size:13px; font-weight:bold;"
         th:style="${statutFiltre == 1} ? 'background-color:#856404; color:#fff;' : 'background-color:#fff3cd; color:#856404;'">
        En attente
      </a>
      <a th:href="@{/admin/rdv(statut=0)}"
         style="border-radius:10px; padding:8px 16px; text-decoration:none; font-size:13px; font-weight:bold;"
         th:style="${statutFiltre == 0} ? 'background-color:#155724; color:#fff;' : 'background-color:#d4edda; color:#155724;'">
        Réalisés
      </a>
      <a th:href="@{/admin/rdv(statut=3)}"
         style="border-radius:10px; padding:8px 16px; text-decoration:none; font-size:13px; font-weight:bold;"
         th:style="${statutFiltre == 3} ? 'background-color:#721c24; color:#fff;' : 'background-color:#f8d7da; color:#721c24;'">
        Annulés
      </a>
    </div>

    <div class="AdminPanel">
      <p class="AdminPanel-title">
        Rendez-vous (<span th:text="${#lists.size(rdvs)}">0</span>)
      </p>

      <table class="AdminTable">
        <thead>
        <tr>
          <th>Utilisateur</th>
          <th>Prestataire</th>
          <th>Profession</th>
          <th>Date</th>
          <th>Motif</th>
          <th>Statut</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rdv : ${rdvs}">
          <td th:text="${rdv.userEmail}">email</td>
          <td th:text="${rdv.prestataireNom} + ' ' + ${rdv.prestatairePrenom}">Prestataire</td>
          <td th:text="${rdv.professionNom}">Profession</td>
          <td th:text="${#temporals.format(rdv.dateRdv, 'dd/MM/yyyy HH:mm')}">Date</td>
          <td th:text="${rdv.motif}">Motif</td>
          <td>
            <span class="AdminBadge ok" th:if="${rdv.isOK == 0}">Réalisé</span>
            <span class="AdminBadge pending" th:if="${rdv.isOK == 1}">En attente</span>
            <span class="AdminBadge cancel" th:if="${rdv.isOK == 3}">Annulé</span>
          </td>
          <td>
            <a class="AdminAction danger"
               th:href="@{'/admin/rdv/' + ${rdv.id} + '/delete'}"
               title="Supprimer"
               onclick="return confirm('Supprimer ce RDV ?');">
              <i class="fa-solid fa-trash"></i>
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
</body>
</html>
