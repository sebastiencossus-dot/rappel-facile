<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <title>Rappel Facile — Professions</title>
</head>
<body>

<button class="AdminBurger" onclick="toggleAdminMenu()">
    <i class="fa-solid fa-bars" id="burgerIcon"></i>
</button>
<div class="AdminOverlay" id="adminOverlay" onclick="closeAdminMenu()"></div>

<div class="AdminLayout">

    <aside class="AdminSidebar" id="adminSidebar"
           th:replace="~{admin-sidebar :: sidebar('professions')}"></aside>

    <main class="AdminContent">

        <div class="AdminTopbar">
            <h1>Professions &amp; Catégories</h1>
            <div class="AdminTopbar-user">
                Connecté en tant que
                <strong th:text="${currentUser != null ? currentUser.email : 'admin'}"></strong>
            </div>
        </div>

        <!-- Messages flash -->
        <div th:if="${success}"
             style="background-color:#d4edda; color:#155724; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
            <i class="fa-solid fa-check"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}"
             style="background-color:#f8d7da; color:#721c24; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">

            <!-- COLONNE GAUCHE — Professions -->
            <div>
                <!-- Formulaire ajout profession -->
                <div class="AdminPanel" style="margin-bottom:20px;">
                    <p class="AdminPanel-title">Ajouter une profession</p>
                    <form th:action="@{/admin/professions/add}"
                          th:object="${newProfession}"
                          method="post">

                        <div class="mb-3" style="background-color:#E8C9FA; border-radius:15px; padding:12px 18px;">
                            <label style="font-size:12px; font-weight:bold; margin:0;">
                                <i class="fa-solid fa-briefcase"></i> Nom de la profession
                            </label>
                            <input type="text" th:field="*{nom}"
                                   class="form-control"
                                   style="border:none; background:transparent; padding:2px 0;"
                                   placeholder="Ex : Médecin généraliste" required>
                        </div>

                        <div class="mb-3" style="background-color:#F79BC5; border-radius:15px; padding:12px 18px;">
                            <label style="font-size:12px; font-weight:bold; margin:0;">
                                <i class="fa-solid fa-tags"></i> Catégorie
                            </label>
                            <select th:field="*{categorieId}"
                                    class="form-control"
                                    style="border:none; background:transparent; padding:2px 0;" required>
                                <option value="">-- Choisir une catégorie --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">
                                </option>
                            </select>
                        </div>

                        <button type="submit"
                                style="background-color:#000; color:#fff; border-radius:15px; padding:10px 20px; border:none; font-weight:bold; width:100%;">
                            <i class="fa-solid fa-plus"></i> Ajouter
                        </button>
                    </form>
                </div>

                <!-- Liste professions -->
                <div class="AdminPanel">
                    <p class="AdminPanel-title">
                        Professions (<span th:text="${#lists.size(professions)}">0</span>)
                    </p>
                    <table class="AdminTable">
                        <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Catégorie</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${professions}">
                            <td th:text="${p.nom}">Nom</td>
                            <td>
                                <span th:text="${p.categorieNom}"
                                      style="background-color:#E8C9FA; border-radius:8px; padding:3px 10px; font-size:11px;">
                                </span>
                            </td>
                            <td>
                                <a class="AdminAction danger"
                                   th:href="@{'/admin/professions/' + ${p.id} + '/delete'}"
                                   title="Supprimer"
                                   onclick="return confirm('Supprimer cette profession ?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- COLONNE DROITE — Catégories -->
            <div>
                <!-- Formulaire ajout catégorie -->
                <div class="AdminPanel" style="margin-bottom:20px;">
                    <p class="AdminPanel-title">Ajouter une catégorie</p>
                    <form th:action="@{/admin/professions/categories/add}"
                          th:object="${newCategorie}"
                          method="post">

                        <div class="mb-3" style="background-color:#EFE9B7; border-radius:15px; padding:12px 18px;">
                            <label style="font-size:12px; font-weight:bold; margin:0;">
                                <i class="fa-solid fa-folder"></i> Nom de la catégorie
                            </label>
                            <input type="text" th:field="*{name}"
                                   class="form-control"
                                   style="border:none; background:transparent; padding:2px 0;"
                                   placeholder="Ex : Médecine" required>
                        </div>

                        <button type="submit"
                                style="background-color:#000; color:#fff; border-radius:15px; padding:10px 20px; border:none; font-weight:bold; width:100%;">
                            <i class="fa-solid fa-plus"></i> Ajouter
                        </button>
                    </form>
                </div>

                <!-- Liste catégories -->
                <div class="AdminPanel">
                    <p class="AdminPanel-title">
                        Catégories (<span th:text="${#lists.size(categories)}">0</span>)
                    </p>
                    <table class="AdminTable">
                        <thead>
                        <tr>
                            <th>Nom</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.name}">Nom</td>
                            <td>
                                <a class="AdminAction danger"
                                   th:href="@{'/admin/professions/categories/' + ${cat.id} + '/delete'}"
                                   title="Supprimer"
                                   onclick="return confirm('Supprimer cette catégorie ?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
</body>
</html>
