<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <title>Rappel Facile — Modifier utilisateur</title>
</head>
<body>

<button class="AdminBurger" onclick="toggleAdminMenu()">
    <i class="fa-solid fa-bars" id="burgerIcon"></i>
</button>
<div class="AdminOverlay" id="adminOverlay" onclick="closeAdminMenu()"></div>

<div class="AdminLayout">

    <aside class="AdminSidebar" id="adminSidebar" th:replace="~{admin-sidebar :: sidebar('users')}"></aside>

    <main class="AdminContent">

        <div class="AdminTopbar">
            <h1>Modifier l'utilisateur</h1>
        </div>

        <div class="AdminPanel" style="max-width:600px;">

            <form th:action="@{'/admin/users/' + ${user.idUser} + '/edit'}" th:object="${user}" method="post">

                <div class="mb-3" style="background-color:#E8C9FA; border-radius:15px; padding:12px 18px;">
                    <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">Nom</label>
                    <input type="text" th:field="*{nom}" class="form-control" style="border:none; background:transparent; padding:2px 0;">
                </div>

                <div class="mb-3" style="background-color:#E8C9FA; border-radius:15px; padding:12px 18px;">
                    <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">Prénom</label>
                    <input type="text" th:field="*{prenom}" class="form-control" style="border:none; background:transparent; padding:2px 0;">
                </div>

                <div class="mb-3" style="background-color:#F79BC5; border-radius:15px; padding:12px 18px;">
                    <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">Email</label>
                    <input type="text" th:field="*{email}" class="form-control" style="border:none; background:transparent; padding:2px 0;">
                </div>

                <div class="mb-3" style="background-color:#EFE9B7; border-radius:15px; padding:12px 18px;">
                    <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">Téléphone</label>
                    <input type="text" th:field="*{tel}" class="form-control" style="border:none; background:transparent; padding:2px 0;">
                </div>

                <div class="mb-3" style="background-color:#B0E1FA; border-radius:15px; padding:12px 18px;">
                    <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">Rôle</label>
                    <select th:field="*{role}" class="form-control" style="border:none; background:transparent; padding:2px 0;">
                        <option value="USER">Utilisateur</option>
                        <option value="ADMIN">Administrateur</option>
                    </select>
                </div>

                <div class="d-flex" style="gap:10px; margin-top:20px;">
                    <button type="submit" style="background-color:#000; color:#fff; border-radius:15px; padding:10px 25px; border:none; font-weight:bold;">
                        Enregistrer
                    </button>
                    <a th:href="@{/admin/users}" style="background-color:#eee; color:#000; border-radius:15px; padding:10px 25px; text-decoration:none; font-weight:bold;">
                        Annuler
                    </a>
                </div>

            </form>

        </div>

    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
</body>
</html>
