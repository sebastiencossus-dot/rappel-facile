<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <title>Rappel Facile</title>
</head>
<div th:insert="~{header :: header}"></div>

<main class="ContentBox">
    <div style="width: 85%; margin: auto">

        <h3>Répartition par catégorie</h3>
        <canvas id="chartCategories"></canvas>

        <h3 style="margin-top: 40px">Répartition par statut</h3>
        <canvas id="chartStatuts"></canvas>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script th:inline="javascript">

    const labels = /*[[${labels}]]*/ [];

const medical = /*[[${medical}]]*/ [];
const beaute = /*[[${beaute}]]*/ [];
const soin = /*[[${soin}]]*/ [];
const administratif = /*[[${administratif}]]*/ [];
const effectue = /*[[${effectue}]]*/ [];
const rate     = /*[[${rate}]]*/     [];
const avenir   = /*[[${avenir}]]*/   [];

const ctx = document.getElementById('myChart');

new Chart(document.getElementById('chartCategories'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [
            { label: 'Médical',       data: medical,       backgroundColor: 'rgba(54, 162, 235, 0.7)'  },
            { label: 'Beauté',        data: beaute,        backgroundColor: 'rgba(255, 99, 132, 0.7)'  },
            { label: 'Soin',          data: soin,          backgroundColor: 'rgba(153, 102, 255, 0.7)' },
            { label: 'Administratif', data: administratif, backgroundColor: 'rgba(255, 206, 86, 0.7)'  }
        ]
    },
    options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { x: { stacked: false }, y: { beginAtZero: true } }
    }
});

    new Chart(document.getElementById('chartStatuts'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [
            { label: 'Effectué',  data: effectue, backgroundColor: 'rgba(75, 192, 100, 0.7)' },
            { label: 'Raté',      data: rate,     backgroundColor: 'rgba(255, 50, 50, 0.7)'  },
            { label: 'À venir',   data: avenir,   backgroundColor: 'rgba(255, 165, 0, 0.7)'  }
        ]
    },
    options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { x: { stacked: false }, y: { beginAtZero: true } }
    }
});

    function chargerRDV(datasetLabel, label) {

    let type;
    let valeur;

    // déterminer si c'est une catégorie ou un statut
    if (["Médical", "Beauté", "Soin", "Administratif"].includes(datasetLabel)) {
        type = "categorie";
        valeur = datasetLabel.toLowerCase();
    } else {
        type = "statut";

        if (datasetLabel === "Effectué") valeur = 0;
        if (datasetLabel === "Raté") valeur = 3;
        if (datasetLabel === "À venir") valeur = 1;
    }

    fetch(`/api/rdvs/details?mois=${label}&type=${type}&valeur=${valeur}`)
        .then(res => res.json())
        .then(data => afficherRDV(data, datasetLabel, label));
}

</script>
