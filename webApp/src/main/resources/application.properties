spring.application.name=webapp


server.port=8080
server.forward-headers-strategy=framework

spring.profiles.active=prod
#spring.config.import=optional:configserver:http://docker.internal:8071/
spring.config.import=optional:configserver:http://localhost:8071/

cloud.consul.host=localhost
cloud.consul.port=8500
cloud.consul.discovery.enabled=true
cloud.consul.discovery.health-check-interval=15s

server.servlet.session.timeout=480m
server.servlet.session.cookie.name=JSESSIONID

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always

spring.cloud.openfeign.okhttp.enabled=true

app.upload.dir=./uploads/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB