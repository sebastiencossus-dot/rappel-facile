<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <title>RDV Form</title>
</head>

<body>

<div th:insert="~{header :: header}"></div>

<main class="ContentBox">

    <h2 class="ContentBox-title"
        th:text="${rdv != null} ? 'Modifier le rendez-vous' : 'Créer un rendez-vous'">
    </h2>

    <section class="ContentBox2-detailRdv">

        <!-- PRESTATAIRE (si edit) -->
        <div class="ContentBox2-detailRdv-prestataire" th:if="${rdv != null}">
            <p>
                <span th:text="${rdv.prestataireNom}"></span>
                <span class="ContentBox2-detailRdv-prestataire-spe"
                      th:text="${rdv.professionNom}"></span>
            </p>
            <img src="/images/calendar-add.png" alt="rdv">
        </div>

        
        <form th:object="${rdvForm}"
              th:action="${rdv != null} ? @{'/rdv/update/' + ${rdv.id}} : @{/rdv/add}"
              method="post"
              style="width:100%; display:contents;">

            <!-- Date -->
            <div class="ContentBox2-detailRdv-card fond1">
                <p class="ContentBox2-detailRdv-card-left">
                    <i class="fa-regular fa-calendar"></i> Date du rendez-vous
                </p>
                <input type="datetime-local"
                       th:field="*{dateRdv}"
                       class="ContentBox2-detailRdv-input"/>
            </div>

            <!-- Motif -->
            <div class="ContentBox2-detailRdv-card fond2">
                <p class="ContentBox2-detailRdv-card-left">
                    <i class="fa-solid fa-book"></i> Motif
                </p>
                <input type="text"
                       th:field="*{motif}"
                       class="ContentBox2-detailRdv-input"
                       placeholder="Ex : Consultation annuelle"/>
            </div>

            <!-- Prestataire -->
            <div class="ContentBox2-detailRdv-card fond2">
                <p class="ContentBox2-detailRdv-card-left">
                    <i class="fa-regular fa-user"></i> Prestataire
                </p>
                <select id="prestataireSelect"
                        th:field="*{prestataireId}"
                        class="ContentBox2-detailRdv-input"
                        onchange="loadPrestataireDetails(this.value)">
                    <option value="">-- Choisir un prestataire --</option>
                    <option th:each="p : ${prestataires}"
                            th:value="${p.id}"
                            th:text="${p.nom + ' ' + p.prenom}">
                    </option>
                </select>
            </div>

            <!-- Profession — caché jusqu'au choix -->
            <div id="professionSection"
                 class="ContentBox2-detailRdv-card fond1"
                 style="display:none;">
                <p class="ContentBox2-detailRdv-card-left">
                    <i class="fa-solid fa-briefcase"></i> Profession
                </p>
                <select id="professionSelect"
                        th:field="*{professionId}"
                        class="ContentBox2-detailRdv-input">
                    <option value="">-- Choisir --</option>
                </select>
            </div>

            <!-- Adresse — caché jusqu'au choix -->
            <div id="adresseSection"
                 class="ContentBox2-detailRdv-card fond1"
                 style="display:none;">
                <p class="ContentBox2-detailRdv-card-left">
                    <i class="fa-solid fa-location-dot"></i> Adresse
                </p>
                <select id="adresseSelect"
                        th:field="*{adresseId}"
                        th:attr="data-selected=${rdvForm.adresseId}"
                        class="ContentBox2-detailRdv-input"
                        required>
                    <option th:each="adr : ${adresses}"
                            th:value="${adr.id}"
                            th:text="${adr.numero + ' ' + adr.rue + ', ' + adr.Codepostal + ' ' + adr.ville}"
                            th:selected="${rdvForm.adresseId == adr.id}">
                    </option>
                </select>
            </div>

            <!-- Info alerte -->
            <div class="ContentBox2-detailRdv-card fond3">
                <p class="ContentBox2-detailRdv-card-right">
                    Une alerte sera envoyée 24h avant le rendez-vous.<br>
                    Vous pourrez ajouter d'autres rappels après création.
                </p>
            </div>

            <!-- Bouton submit -->
            <div class="ContentBox2-detailRdv-submit" style="grid-column: 1 / -1;">
                <button type="submit"
                        class="ContentBox2-detailRdv-btn btn2"
                        th:text="${rdv != null} ? 'Modifier le RDV' : 'Créer le RDV'">
                </button>
            </div>

        </form>

    </section>

</main>

<div th:insert="~{footer :: footer}"></div>

<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>

<script th:inline="javascript">
    const prestatairesData = /*[[${prestataires}]]*/ [];

    function loadPrestataireDetails(prestataireId) {
        const professionSection = document.getElementById('professionSection');
        const adresseSection = document.getElementById('adresseSection');
        const professionSelect = document.getElementById('professionSelect');
        const adresseSelect = document.getElementById('adresseSelect');

        professionSelect.innerHTML = '<option value="">-- Choisir --</option>';
        adresseSelect.innerHTML = '<option value="">-- Choisir --</option>';
        professionSection.style.display = 'none';
        adresseSection.style.display = 'none';

        if (!prestataireId) return;

        // Avant le fetch, ajouter sur le formulaire
document.querySelector('form').addEventListener('submit', function(e) {
    const adresseVal = document.getElementById('adresseSelect').value;
    if (!adresseVal || adresseVal === 'null' || adresseVal === '') {
        e.preventDefault();
        alert('Veuillez choisir une adresse');
    }
});

        fetch('/rdv/prestataire/' + prestataireId + '/details')
            .then(response => response.json())
            .then(data => {

             console.log('Adresses reçues:', JSON.stringify(data.adresses));

                if (data.professions && data.professions.length > 0) {
                    data.professions.forEach(prof => {
                        const option = document.createElement('option');
                        option.value = prof.id;
                        option.textContent = prof.nom;
                        professionSelect.appendChild(option);
                    });
                    professionSection.style.display = 'flex';
                }

                if (data.adresses && data.adresses.length > 0) {

        data.adresses.forEach(adr => {
            const option = document.createElement('option');
            option.value = adr.id;
            option.textContent =
                (adr.numero || '') + ' ' +
                (adr.rue || '') + ', ' +
                (adr.ville || '');

            adresseSelect.appendChild(option);
        });

        adresseSection.style.display = 'flex';

        // 👉 IMPORTANT : préselection si existe déjà
        const current = adresseSelect.getAttribute("data-selected");
        if (current) {
            adresseSelect.value = current;
        }
    }
})
            .catch(err => console.error('Erreur:', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('prestataireSelect');
        if (select && select.value) {
            loadPrestataireDetails(select.value);
        }
    });
</script>

</body>
</html>
