<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <title>Modifier Prestataire</title>
</head>

<body>

<div th:insert="~{header :: header}"></div>

<main class="ContentBox">

  <h2 class="ContentBox-title">Modifier Prestataire</h2>

  <form th:action="@{'/prestataires/edit/' + ${prestataire.id}}" method="post"
        class="ContentBox2-detailRdv">

    <!-- INFOS -->
    <div class="ContentBox2-detailRdv-card fond1">
      <p class="ContentBox2-detailRdv-card-left">
        <i class="fa-regular fa-user"></i> Informations
      </p>

      <input type="text" name="nom"
             th:value="${prestataire.nom}"
             class="ContentBox2-detailRdv-input"
             placeholder="Nom" required/>

      <input type="text" name="prenom"
             th:value="${prestataire.prenom}"
             class="ContentBox2-detailRdv-input"
             placeholder="Prénom" required/>
    </div>

    <!-- PROFESSIONS — select parmi toutes les professions -->
    <div class="ContentBox2-detailRdv-card fond2">
      <p class="ContentBox2-detailRdv-card-left">
        <i class="fa-solid fa-briefcase"></i> Professions
      </p>
      <div id="profession-container">
        <!-- Pour chaque profession déjà liée, préselectionner -->
        <div class="mb-2" th:each="profId : ${prestataire.professionIds}">
          <select name="professionIds" class="ContentBox2-detailRdv-input">
            <option value="">-- Choisir --</option>
            <option th:each="p : ${professions}"
                    th:value="${p.id}"
                    th:text="${p.nom}"
                    th:selected="${p.id == profId}">
            </option>
          </select>
          <button type="button" class="btn btn-danger btn-sm mt-1"
                  onclick="this.parentElement.remove()">Supprimer</button>
        </div>
      </div>
      <button type="button" class="ContentBox2-detailRdv-btn btn2 mt-2"
              onclick="addProfession()">+ Ajouter profession</button>
    </div>

    <!-- ADRESSES — choisir existante OU saisir nouvelle -->
    <div class="ContentBox2-detailRdv-card fond3">
      <p class="ContentBox2-detailRdv-card-left">
        <i class="fa-solid fa-location-dot"></i> Adresses
      </p>
      <div id="adresse-container">
        <div class="mb-2 adresse-block" th:each="adr : ${prestataire.adresses}">
          <select name="adresseIds" class="ContentBox2-detailRdv-input mb-1"
                  onchange="toggleNewAdresse(this)">
            <option value="">-- Nouvelle adresse --</option>
            <option th:each="a : ${adresses}"
                    th:value="${a.id}"
                    th:text="${a.numero + ' ' + a.rue + ', ' + a.codepostal + ' ' + a.ville}"
                    th:selected="${a.id == adr.id}">
            </option>
          </select>


          <div class="new-adresse-fields" style="display:none;">
            <input type="text" name="rues" class="ContentBox2-detailRdv-input" placeholder="Rue"/>
            <input type="text" name="numeros" class="ContentBox2-detailRdv-input" placeholder="Numéro"/>
            <input type="text" name="villes" class="ContentBox2-detailRdv-input" placeholder="Ville"/>
            <input type="text" name="codePostals" class="ContentBox2-detailRdv-input" placeholder="Code postal"/>
          </div>

          <button type="button" class="btn btn-danger btn-sm mt-1"
                  onclick="this.parentElement.remove()">Supprimer</button>
        </div>
      </div>
      <button type="button" class="ContentBox2-detailRdv-btn btn2 mt-2"
              onclick="addAdresse()">+ Ajouter adresse</button>
    </div>

    <!-- SUBMIT -->
    <div class="ContentBox2-detailRdv-submit" style="grid-column: 1 / -1;">
      <button type="submit"
              class="ContentBox2-detailRdv-btn btn2">
        Enregistrer les modifications
      </button>
    </div>

  </form>

</main>

<div th:insert="~{footer :: footer}"></div>
<script th:inline="javascript">
  const professions = [[${professions}]];
  const adresses = [[${adresses}]];
</script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js"></script>
<script src="/js/prestataire-edit.js"></script>

</body>
</html>
