<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body style="background-color:#B0E1FA;">

<div class="container">

    <div class="row justify-content-center" style="margin-top:60px;">

        <div class="col-md-5">

            <!-- Carte bandeau (style prestataire rose) -->
            <div style="background-color:#F79BC5; border-radius:25px 25px 0 0; padding:25px; text-align:center;">
                <img th:src="@{/images/logo.png}" width="70">
                <h2 style="margin:10px 0 0 0; font-size:24px; font-weight:bold; color:#000;">
                    Connexion
                </h2>
                <p style="margin:0; font-size:13px; color:#444;">
                    Accédez à vos rendez-vous et rappels
                </p>
            </div>

            <!-- Formulaire (fond blanc, bords arrondis bas) -->
            <div style="background-color:#ffffff; border-radius:0 0 25px 25px; padding:30px; box-shadow:4px 4px 8px 0 rgba(0,0,0,0.2);">

                <form th:action="@{/signin}" method="post">

                    <div class="mb-3" style="background-color:#E8C9FA; border-radius:15px; padding:12px 18px;">
                        <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">
                            <i class="fa-solid fa-envelope"></i> Email
                        </label>
                        <input type="text"
                               name="email"
                               class="form-control"
                               style="border:none; background:transparent; padding:2px 0; font-size:14px;"
                               placeholder="votre@email.fr"
                               required>
                    </div>

                    <div class="mb-3" style="background-color:#EFE9B7; border-radius:15px; padding:12px 18px; position:relative;">
                        <label class="form-label" style="font-size:12px; font-weight:bold; margin:0;">
                            <i class="fa-solid fa-lock"></i> Mot de passe
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               style="border:none; background:transparent; padding:2px 0; font-size:14px; padding-right:28px;"
                               placeholder="••••••••"
                               required>
                        <i class="fa-regular fa-eye toggle-password"
                           data-target="password"
                           style="position:absolute; right:18px; bottom:14px; cursor:pointer; color:#555;"></i>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit"
                                style="background-color:#000; color:#fff; border-radius:15px; padding:12px; border:none; font-weight:bold;">
                            Se connecter
                        </button>
                    </div>

                    <div class="text-center mt-3" style="font-size:13px;">
                        <p style="margin:0;">
                            Pas encore de compte ?
                            <a th:href="@{/signup}" style="color:#000; font-weight:bold; text-decoration:underline;">
                                Créer un compte
                            </a>
                        </p>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
<script>
    document.querySelectorAll('.toggle-password').forEach(icon => {
        icon.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const isPassword = input.getAttribute('type') === 'password';

            input.setAttribute('type', isPassword ? 'text' : 'password');
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    });
</script>

</body>
</html>
