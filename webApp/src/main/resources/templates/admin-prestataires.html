<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <title>Rappel Facile — Prestataires</title>
</head>
<body>

<button class="AdminBurger" onclick="toggleAdminMenu()">
    <i class="fa-solid fa-bars" id="burgerIcon"></i>
</button>
<div class="AdminOverlay" id="adminOverlay" onclick="closeAdminMenu()"></div>

<div class="AdminLayout">

    <aside class="AdminSidebar" id="adminSidebar" th:replace="~{admin-sidebar :: sidebar('prestataires')}"></aside>

    <main class="AdminContent">

        <div class="AdminTopbar">
            <h1>Prestataires</h1>
            <div class="AdminTopbar-user">
                Connecté en tant qu'<strong th:text="${currentUser != null ? currentUser.email : 'admin'}"></strong>
            </div>
        </div>

        <div th:if="${success}"
             style="background-color:#d4edda; color:#155724; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
            <i class="fa-solid fa-check"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}"
             style="background-color:#f8d7da; color:#721c24; border-radius:10px; padding:12px 20px; margin-bottom:15px;">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <div class="AdminPanel">
            <p class="AdminPanel-title">
                Tous les prestataires (<span th:text="${#lists.size(prestataires)}">0</span>)
            </p>

            <table class="AdminTable">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Professions</th>
                    <th>Adresses</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prestataires}">
                    <td th:text="${p.nom}">Nom</td>
                    <td th:text="${p.prenom}">Prénom</td>
                    <td>
                        <span th:each="prof, iter : ${p.professions}"
                              th:text="${prof} + (${!iter.last} ? ', ' : '')">
                        </span>
                    </td>
                    <td>
                        <span th:each="adr, iter : ${p.adresses}"
                              th:text="${adr.rue} + ' ' + ${adr.ville} + (${!iter.last} ? ', ' : '')">
                        </span>
                    </td>
                    <td>
                        <a class="AdminAction"
                           th:href="@{'/admin/prestataires/' + ${p.id}}"
                           title="Voir le détail">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <a class="AdminAction danger"
                           th:href="@{'/admin/prestataires/' + ${p.id} + '/delete'}"
                           title="Supprimer"
                           onclick="return confirm('Supprimer ce prestataire ?');">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
</body>
</html>
