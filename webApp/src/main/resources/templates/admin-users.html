<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <title>Rappel Facile — Utilisateurs</title>
</head>
<body>

<button class="AdminBurger" onclick="toggleAdminMenu()">
    <i class="fa-solid fa-bars" id="burgerIcon"></i>
</button>
<div class="AdminOverlay" id="adminOverlay" onclick="closeAdminMenu()"></div>

<div class="AdminLayout">

    <aside class="AdminSidebar" id="adminSidebar" th:replace="~{admin-sidebar :: sidebar('users')}"></aside>

    <main class="AdminContent">

        <div class="AdminTopbar">
            <h1>Utilisateurs</h1>
            <div class="AdminTopbar-user">
                Connecté en tant que <strong th:text="${currentUser != null ? currentUser.email : 'admin'}">admin</strong>
            </div>
        </div>

        <div class="AdminPanel">
            <p class="AdminPanel-title">
                Tous les utilisateurs (<span th:text="${#lists.size(users)}">0</span>)
            </p>

            <table class="AdminTable">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Rôle</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.nom}">Nom</td>
                    <td th:text="${user.prenom}">Prénom</td>
                    <td th:text="${user.email}">email@exemple.fr</td>
                    <td th:text="${user.tel}">0600000000</td>
                    <td>
                        <span class="AdminBadge ok" th:if="${user.role == 'ADMIN'}">Admin</span>
                        <span class="AdminBadge pending" th:if="${user.role != 'ADMIN'}">Utilisateur</span>
                    </td>
                    <td>
                        <a class="AdminAction" th:href="@{'/admin/users/' + ${user.idUser} + '/edit'}" title="Modifier">
                            <i class="fa-solid fa-pen"></i>
                        </a>
                        <a class="AdminAction danger" th:href="@{'/admin/users/' + ${user.idUser} + '/delete'}"
                           title="Supprimer"
                           onclick="return confirm('Supprimer cet utilisateur ?');">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

<script th:src="@{/js/admin.js}"></script>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
</body>
</html>
