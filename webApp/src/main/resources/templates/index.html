<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/style.css" rel="stylesheet">
    <title>Rappel Facile</title>
</head>
<div th:insert="~{header :: header}"></div>

<main class="ContentBox">
    <h2 class="ContentBox-title">Vos rendez-vous</h2>
    <div class="ContentBox-rdvBox">
        <div class="ContentBox-rdvBox">
            <section class="ContentBox-rdvBox RdvBox jour">

                <h2 class="RdvBox-title">Rendez-vous du jour</h2>

                <div th:if="${#lists.isEmpty(rdvJour)}">
                    <p>Aucun rendez-vous aujourd’hui</p>
                </div>
                <div th:each="rdv : ${rdvJour ?: {}}"
                     class="RdvBox-card">

                    <a th:href="@{'/rdv/' + ${rdv.id}}"
                       class="RdvBox-card-link">

                        <i class="fa-regular fa-alarm-clock RdvBox-card-clock"></i>
                        
                        <p class="RdvBox-card-text">
                            <span class="RdvBox-card-text-motif"

                                  th:text="'A :' + ${#temporals.format(rdv.dateRdv, 'HH:mm')}">
                        </span>
                            <br>
                            <span class="RdvBox-card-text-time"
                  th:text="'Motif : ' + ${rdv.motif}">
            </span>
            

            

                    </p>
                    
                    <p class="RdvBox-card-prestataire"
                       th:text="${rdv.prestataireNom} + ' ' + ${rdv.prestatairePrenom}">
                    </p>
                    
                </a>
                </div>

            </section>
            <section class="ContentBox-rdvBox RdvBox attente">

                <h2 class="RdvBox-title">En attente de validation</h2>

                <div th:if="${#lists.isEmpty(rdvAttente)}">
                    <p>Aucun rendez-vous en attente de validation</p>
                </div>

                <div th:each="rdv : ${rdvAttente ?: {}}" class="RdvBox-card">

                    <i class="fa-regular fa-calendar RdvBox-card-clock"></i>

                    <p class="RdvBox-card-text">
                        <span class="RdvBox-card-text-time"
                         th:text="${#temporals.format(rdv.dateRdv, 'dd/MM/yyyy HH:mm')}">
                        </span>
                        <br>
                        <span class="RdvBox-card-text-motif"
                              th:text="'Motif : ' + ${rdv.motif}">
                        </span>
                    </p>

                    <form th:action="@{'/rdv/' + ${rdv.id} + '/valider'}" method="post" class="pt-2 RdvBox-card-btns yes" style="flex-shrink:0;" >
                        <input type="hidden" name="statut" value="0"/>
                        <button type="submit" class="btn btn-success btn-sm">
                            <i class="fa-regular fa-square-check"></i> Oui
                        </button>
                    </form>


                    <form th:action="@{'/rdv/' + ${rdv.id} + '/valider'}" method="post" class="pt-2 RdvBox-card-btns no" style="flex-shrink:0;">
                        <input type="hidden" name="statut" value="3"/>
                        <button type="submit" class="btn btn-danger btn-sm">
                            <i class="fa-solid fa-ban"></i> Non
                        </button>
                    </form>

                </div>
            </section>
        </div>
        <section class="ContentBox-rdvBox RdvBox autre">

            <h2 class="RdvBox-title">Autres RDV</h2>
            <div th:if="${#lists.isEmpty(rdvAutres)}">
                <p>Aucun autre rendez-vous a venir</p>
            </div>
            <div th:each="rdv : ${rdvAutres ?: {}}"
                 class="RdvBox-card">
                <a th:href="@{'/rdv/' + ${rdv.id}}"
                       class="RdvBox-card-link">
                    <i class="fa-regular fa-calendar RdvBox-card-clock"></i>

                    <p class="RdvBox-card-text">

                    <span class="RdvBox-card-text-time"
                        th:text="${#temporals.format(rdv.dateRdv, 'EEEE dd MMMM yyyy HH/mm', T(java.util.Locale).FRENCH)}">
                    </span>

                    <br>

                    <span class="RdvBox-card-text-motif"
                          th:text="${rdv.professionNom}">
                    </span>
                    </p>

                    <p class="RdvBox-card-prestataire"
                       th:text="${rdv.prestataireNom} + ' ' + ${rdv.prestatairePrenom}">
                    </p>
                </a>
            </div>

        </section>

    </div>
</main>

<div th:insert="~{footer :: footer}"></div>
<script src="https://kit.fontawesome.com/0aa6008ea0.js" crossorigin="anonymous"></script>
